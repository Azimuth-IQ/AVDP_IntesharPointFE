<!DOCTYPE html>
<!--
  UX-154: `lang` and `dir` on the document, not just inside the Flutter canvas.
  Arabic is this product's primary locale, and with neither attribute a screen
  reader announces Arabic with an English voice and browsers offer to translate
  the page. Flutter manages direction for its own widgets, so this is about the
  document the browser sees.

  Static `ar`/`rtl` because that is what almost every session is. A viewer who
  switches to English gets correct text either way — Flutter re-lays out its own
  tree — the attribute just stops matching until reload. Making it follow the
  in-app locale needs a JS bridge, which is not worth it for that.
-->
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Inteshar Platform — telecom voucher distribution platform.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Inteshar Platform">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Inteshar Platform</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
