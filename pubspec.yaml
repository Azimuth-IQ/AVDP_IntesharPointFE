name: inteshar
description: "Inteshar Point — telecom voucher distribution platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # HTTP + serialization
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Operational logging — device/app context for log attribution
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.0

  # In-app APK self-update (Android sideload)
  open_filex: ^4.5.0          # opens the downloaded APK → system installer
  permission_handler: ^11.3.1 # REQUEST_INSTALL_PACKAGES grant flow
  path_provider: ^2.1.4       # app-specific external dir to save the APK
  crypto: ^3.0.5              # sha256 integrity check before install

  # Files / Excel
  file_picker: ^8.1.2
  excel: ^4.0.6
  web: ^1.1.0

  # Bluetooth thermal printing
  flutter_blue_plus: ^1.32.12
  esc_pos_utils_plus: ^2.0.4
  image: ^4.2.0

  # UX
  google_fonts: ^6.2.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  flutter_colorpicker: ^1.1.0   # brand-colour wheel (alongside manual hex input)
  crop_your_image: ^2.0.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  # Brand icon + splash generators (one-shot; see config blocks at end of file)
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: CodecPro
      fonts:
        - asset: assets/fonts/CodecPro-Light.ttf
          weight: 300
        - asset: assets/fonts/CodecPro-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/CodecPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/CodecPro-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/CodecPro-News.ttf
          weight: 500
        - asset: assets/fonts/CodecPro-NewsItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/CodecPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/CodecPro-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/CodecPro-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/CodecPro-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/CodecPro-Heavy.ttf
          weight: 900
        - asset: assets/fonts/CodecPro-HeavyItalic.ttf
          weight: 900
          style: italic

# --- Brand identity generation (Inteshar) -----------------------------------
# Source art lives in assets/branding/ (not bundled). Regenerate after edits:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  image_path: "assets/branding/icon_app.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#1A1714"
  adaptive_icon_foreground: "assets/branding/icon_fg.png"
  web:
    generate: true
    image_path: "assets/branding/icon_app.png"
    background_color: "#1A1714"
    theme_color: "#E2AD25"

flutter_native_splash:
  color: "#1A1714"
  image: "assets/branding/splash_star.png"
  android: true
  web: false
  android_12:
    image: "assets/branding/splash_star.png"
    color: "#1A1714"
