name: UAT — Frontend

on:
  push:
    branches: [uat]
  workflow_dispatch:

concurrency:
  group: uat-frontend
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/azimuth-iq/inteshar-web

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable   # pin to your `flutter --version` for fully reproducible builds

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # API_BASE points the web app at the UAT backend on the SAME origin
      # (Caddy routes /api → backend), so there's no CORS / "blocked origin" and
      # testers don't need to set a server URL. Update when a domain is added.
      - run: flutter build web --release --dart-define=API_BASE=http://34.185.153.95

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:uat
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull + restart web on the VM (IAP SSH)
        run: |
          gcloud compute ssh "${{ secrets.GCE_INSTANCE }}" \
            --zone "${{ secrets.GCP_ZONE }}" --tunnel-through-iap --quiet \
            --command "cd /opt/inteshar && sudo docker compose pull web && sudo docker compose up -d && sudo docker image prune -f"
