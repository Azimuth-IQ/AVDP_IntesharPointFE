server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA deep-link fallback (GoRouter uses path-based routes).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed static assets.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|wasm|json)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
