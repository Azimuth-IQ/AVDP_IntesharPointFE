name: inteshar
description: "Inteshar Point — voucher distribution demo app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # HTTP + serialization
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Operational logging — device/app context for log attribution
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.0

  # In-app APK self-update (Android sideload)
  open_filex: ^4.5.0          # opens the downloaded APK → system installer
  permission_handler: ^11.3.1 # REQUEST_INSTALL_PACKAGES grant flow
  path_provider: ^2.1.4       # app-specific external dir to save the APK
  crypto: ^3.0.5              # sha256 integrity check before install

  # Files / Excel
  file_picker: ^8.1.2
  excel: ^4.0.6
  web: ^1.1.0

  # Bluetooth thermal printing
  flutter_blue_plus: ^1.32.12
  esc_pos_utils_plus: ^2.0.4
  image: ^4.2.0

  # UX
  google_fonts: ^6.2.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: CodecPro
      fonts:
        - asset: assets/fonts/CodecPro-Light.ttf
          weight: 300
        - asset: assets/fonts/CodecPro-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/CodecPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/CodecPro-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/CodecPro-News.ttf
          weight: 500
        - asset: assets/fonts/CodecPro-NewsItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/CodecPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/CodecPro-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/CodecPro-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/CodecPro-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/CodecPro-Heavy.ttf
          weight: 900
        - asset: assets/fonts/CodecPro-HeavyItalic.ttf
          weight: 900
          style: italic
