name: Android APK (UAT / Production)

# One workflow for both servers, so the run number (= the APK versionCode) keeps rising across
# them: a production APK must always be newer than any UAT APK already installed, or Android
# refuses it as a downgrade. The branch picks the server:
#   uat  -> https://inteshar.smartsolutionsiraq.net, key RELEASE_API_KEY
#   prod -> https://inteshar.azimuth-iraq.com,       key PROD_RELEASE_API_KEY
# Both publish on the `uat` update channel: it is the channel every installed app asks for
# (release_repository.dart); renaming it would cut every app off from updates.
on:
  push:
    branches: [uat, prod]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # The platform's https address — baked into the APK, and where CI uploads/publishes it.
  API_BASE: ${{ github.ref_name == 'prod' && 'https://inteshar.azimuth-iraq.com' || 'https://inteshar.smartsolutionsiraq.net' }}
  # NOT named CHANNEL — subosito/flutter-action reads $CHANNEL and would treat
  # it as the Flutter channel.
  RELEASE_CHANNEL: uat
  RELEASE_PLATFORM: android
  # Production: every app older than the first production APK must update (blocking screen),
  # because it still points at the old address. vars.PROD_MIN_SUPPORTED_VERSION_CODE holds that
  # first production versionCode once it exists; until then a production build requires itself.
  MIN_SUPPORTED: ${{ github.ref_name == 'prod' && (vars.PROD_MIN_SUPPORTED_VERSION_CODE || github.run_number) || 0 }}

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: newer Flutter (3.47+) deprecates package:flutter/material.dart, which fails
          # `flutter analyze` across the app. Move the pin only with a migration.
          flutter-version: 3.38.5

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Release signing — same key on every build, or Android rejects the update.
      - name: Write signing config
        working-directory: android
        run: |
          # Gradle's file("inteshar-release.jks") resolves relative to android/app,
          # so the keystore must live there; key.properties stays at android/.
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/inteshar-release.jks
          cat > key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=inteshar-release.jks
          EOF

      - name: Build signed APK
        id: build
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          # run_number = monotonic Android versionCode (strictly increasing).
          # ARM only: every POS terminal and phone is ARM, and the x86_64 libraries (emulators,
          # Chromebooks) were a third of the file every device downloads on each update.
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --dart-define=API_BASE=${API_BASE} \
            --build-number=${{ github.run_number }} \
            --build-name="$VERSION_NAME"
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK to object storage (MinIO, via the key-authed backend endpoint)
        id: upload
        env:
          RELEASE_API_KEY: ${{ github.ref_name == 'prod' && secrets.PROD_RELEASE_API_KEY || secrets.RELEASE_API_KEY }}
          VC: ${{ github.run_number }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          RESP=$(curl -sf -X POST "$API_BASE/api/app/upload-apk" \
            -H "X-Release-Key: $RELEASE_API_KEY" \
            -F "file=@$APK" \
            -F "filename=inteshar-$VC.apk")
          URL=$(echo "$RESP" | jq -r '.data.url // empty')
          if [ -z "$URL" ]; then
            echo "::error::APK upload returned no URL — response: $RESP"
            exit 1
          fi
          echo "apk_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Uploaded APK → $URL"

      - name: Publish release to backend
        env:
          RELEASE_API_KEY: ${{ github.ref_name == 'prod' && secrets.PROD_RELEASE_API_KEY || secrets.RELEASE_API_KEY }}
          VC: ${{ github.run_number }}
          IS_PROD: ${{ github.ref_name == 'prod' }}
        run: |
          # Shops read this text on the update sheet. Production gets a short Arabic line —
          # not the English commit message with its trailers (PROD-018) — and every
          # production release is forced: no «لاحقاً» (PROD-019, the client's request
          # 2026-11-21). UAT keeps the commit message and stays optional.
          if [ "$IS_PROD" = "true" ]; then
            MANDATORY=true
            CHANGELOG="تحسينات وإصلاحات في البيع والطباعة."
          else
            MANDATORY=false
            CHANGELOG=$(git log -1 --pretty=%B | grep -viE '^(co-authored-by|signed-off-by):' || true)
          fi
          BODY=$(jq -n \
            --arg channel "$RELEASE_CHANNEL" \
            --arg platform "$RELEASE_PLATFORM" \
            --argjson versionCode "$VC" \
            --arg versionName "${{ steps.build.outputs.version_name }}" \
            --arg apkUrl "${{ steps.upload.outputs.apk_url }}" \
            --argjson sizeBytes "${{ steps.build.outputs.size }}" \
            --arg sha256 "${{ steps.build.outputs.sha256 }}" \
            --argjson mandatory "$MANDATORY" \
            --argjson minSupportedVersionCode "$MIN_SUPPORTED" \
            --arg changelog "$CHANGELOG" \
            '{channel:$channel, platform:$platform, versionCode:$versionCode, versionName:$versionName, apkUrl:$apkUrl, sizeBytes:$sizeBytes, sha256:$sha256, mandatory:$mandatory, minSupportedVersionCode:$minSupportedVersionCode, changelog:$changelog}')

          # Key-authed (X-Release-Key) — no admin login, so 2FA/rotation no longer
          # blocks the publish: the in-app auto-update record now always refreshes.
          curl -sf -X POST "$API_BASE/api/app/release" \
            -H "X-Release-Key: $RELEASE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY"
          echo "Release published for versionCode $VC"
