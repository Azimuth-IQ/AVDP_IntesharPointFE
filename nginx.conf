server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Build outputs (the unhashed main.dart.js, deferred *.part.js, the service
    # worker, bootstrap, and the JSON manifests/version) MUST always revalidate.
    # Flutter's service worker plus a long nginx cache otherwise pin the old
    # build in already-open browsers — the recurring "I deployed but still see
    # the old UI". `expires -1` emits `Cache-Control: no-cache`, so the browser
    # revalidates against the ETag (304 when unchanged, fresh 200 on a new
    # deploy). Keep this BEFORE the long-cache rule so it wins.
    location ~* \.(?:js|json)$ {
        expires -1;
        try_files $uri =404;
    }

    # Genuinely static, stable-named assets (fonts, images, canvaskit wasm) —
    # safe to cache for a week.
    location ~* \.(?:css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|wasm)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # SPA deep-link fallback (GoRouter uses path-based routes). Never cache the
    # HTML entry point, so a new index.html (and the bootstrap it references) is
    # always picked up.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
