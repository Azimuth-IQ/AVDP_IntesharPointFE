name: UAT — Android APK

on:
  push:
    branches: [uat]
  workflow_dispatch:

concurrency:
  group: uat-apk
  cancel-in-progress: true

env:
  API_BASE: http://34.185.153.95
  # NOT named CHANNEL — subosito/flutter-action reads $CHANNEL and would treat
  # it as the Flutter channel.
  RELEASE_CHANNEL: uat
  RELEASE_PLATFORM: android

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Release signing — same key on every build, or Android rejects the update.
      - name: Write signing config
        working-directory: android
        run: |
          # Gradle's file("inteshar-release.jks") resolves relative to android/app,
          # so the keystore must live there; key.properties stays at android/.
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/inteshar-release.jks
          cat > key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=inteshar-release.jks
          EOF

      - name: Build signed APK
        id: build
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          # run_number = monotonic Android versionCode (strictly increasing).
          flutter build apk --release \
            --dart-define=API_BASE=${API_BASE} \
            --build-number=${{ github.run_number }} \
            --build-name="$VERSION_NAME"
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK to object storage (MinIO, via the key-authed backend endpoint)
        id: upload
        env:
          RELEASE_API_KEY: ${{ secrets.RELEASE_API_KEY }}
          VC: ${{ github.run_number }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          RESP=$(curl -sf -X POST "$API_BASE/api/app/upload-apk" \
            -H "X-Release-Key: $RELEASE_API_KEY" \
            -F "file=@$APK" \
            -F "filename=inteshar-$VC.apk")
          URL=$(echo "$RESP" | jq -r '.data.url // empty')
          if [ -z "$URL" ]; then
            echo "::error::APK upload returned no URL — response: $RESP"
            exit 1
          fi
          echo "apk_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Uploaded APK → $URL"

      - name: Publish release to backend
        env:
          RELEASE_API_KEY: ${{ secrets.RELEASE_API_KEY }}
          VC: ${{ github.run_number }}
        run: |
          CHANGELOG=$(git log -1 --pretty=%B)
          BODY=$(jq -n \
            --arg channel "$RELEASE_CHANNEL" \
            --arg platform "$RELEASE_PLATFORM" \
            --argjson versionCode "$VC" \
            --arg versionName "${{ steps.build.outputs.version_name }}" \
            --arg apkUrl "${{ steps.upload.outputs.apk_url }}" \
            --argjson sizeBytes "${{ steps.build.outputs.size }}" \
            --arg sha256 "${{ steps.build.outputs.sha256 }}" \
            --argjson mandatory false \
            --argjson minSupportedVersionCode 0 \
            --arg changelog "$CHANGELOG" \
            '{channel:$channel, platform:$platform, versionCode:$versionCode, versionName:$versionName, apkUrl:$apkUrl, sizeBytes:$sizeBytes, sha256:$sha256, mandatory:$mandatory, minSupportedVersionCode:$minSupportedVersionCode, changelog:$changelog}')

          # Key-authed (X-Release-Key) — no admin login, so 2FA/rotation no longer
          # blocks the publish: the in-app auto-update record now always refreshes.
          curl -sf -X POST "$API_BASE/api/app/release" \
            -H "X-Release-Key: $RELEASE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY"
          echo "Release published for versionCode $VC"
